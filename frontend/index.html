<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CODDY</title>
<meta name="description" content="A local document question answering tool. Files stay on your machine.">
<link rel="stylesheet" href="/static/css/style.css">
<!--
  Vendored, not CDN. Two reasons: the app runs locally and should not depend
  on network availability, and a third-party script on a page that renders
  untrusted document text is a supply-chain risk. The type stack is system
  fonts for the same reason, so the app has no network dependency at all.
-->
<script src="/static/js/vendor/marked.min.js"></script>
<script src="/static/js/vendor/purify.min.js"></script>
</head>
<body>

<!-- ===================== BOOT ===================== -->
<!-- There is no sign-in step: the app asks the server for a local session on
     load. This state covers that handshake and the case where it fails. -->
<div class="boot" id="boot">
  <div class="boot-inner">
    <div class="wordmark">Coddy</div>
    <p class="note" id="boot-note">Starting the local session</p>
    <p class="fault" id="boot-error" role="alert"></p>
    <button type="button" class="btn btn-primary" id="boot-retry">Try again</button>
  </div>
</div>

<!-- ===================== APPLICATION ===================== -->
<div id="app" class="app hidden">

  <button type="button" class="nav-toggle" id="nav-toggle" aria-label="Show conversations and documents" aria-expanded="false" aria-controls="sidebar">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
  </button>

  <!-- The spine sits one tone below the page and is separated by a hairline,
       which reads as the gutter of a bound book. -->
  <aside class="spine" id="sidebar">

    <div class="spine-head">
      <div class="wordmark">Coddy</div>
    </div>

    <div class="spine-rule"></div>

    <section class="spine-block">
      <div class="block-head">
        <h2 class="block-title">Conversations</h2>
        <button type="button" class="btn btn-quiet btn-sm" id="new-chat-btn">New</button>
      </div>
      <div class="list-state" id="session-state" role="status" aria-live="polite"></div>
      <ul class="ledger" id="session-list"></ul>
    </section>

    <section class="spine-block grow">
      <div class="block-head">
        <h2 class="block-title">Documents</h2>
        <button type="button" class="btn btn-quiet btn-sm" id="upload-btn">Upload</button>
      </div>
      <input type="file" id="file-input" class="vh" accept=".pdf,.docx,.txt,.csv,.md,.markdown" tabindex="-1">
      <p class="note" id="upload-hint" role="status" aria-live="polite"></p>
      <div class="list-state" id="document-state" role="status" aria-live="polite"></div>
      <ul class="ledger" id="document-list"></ul>
    </section>

    <div class="spine-foot">
      <!-- The dot marks a state the health probe actually reports, and the
           words beside it repeat that state, so nothing depends on hue. -->
      <span class="status-dot" id="model-dot" data-state="unknown" aria-hidden="true"></span>
      <span class="foot-text" id="model-status">Checking the model</span>
    </div>
  </aside>

  <div class="scrim" id="nav-scrim"></div>

  <main class="reading">

    <header class="masthead">
      <h1 id="chat-title">New conversation</h1>
      <p class="masthead-meta" id="doc-count">0 documents</p>
    </header>

    <!-- The reading column. The measure is capped in CSS so an answer is read
         at a comfortable line length. This is the focal point of the screen. -->
    <div class="column" id="messages"></div>

    <form class="composer" id="composer">
      <label class="vh" for="query">Your question</label>
      <textarea id="query" rows="1" placeholder="Ask a question about your documents"></textarea>
      <button type="submit" class="btn btn-primary" id="send-btn" aria-label="Send question">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
      </button>
    </form>

  </main>
</div>

<!-- ===================== CITATION DIALOG ===================== -->
<div class="modal hidden" id="citation-modal" role="dialog" aria-modal="true" aria-labelledby="citation-title">
  <div class="modal-card">
    <header>
      <h2 id="citation-title"></h2>
      <button type="button" class="icon-btn" id="citation-close" aria-label="Close">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </header>
    <p class="note" id="citation-meta"></p>
    <pre id="citation-body"></pre>
  </div>
</div>

<script src="/static/js/app.js"></script>
</body>
</html>
